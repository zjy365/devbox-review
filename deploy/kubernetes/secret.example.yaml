apiVersion: v1
kind: Secret
metadata:
  name: devbox-review-secret
  namespace: devbox-review
type: Opaque
stringData:
  OPENAI_API_KEY: sk-your-openai-api-key
  DEVBOX_JWT_SIGNING_KEY: your-devbox-jwt-signing-key
  REDIS_PASSWORD: your-redis-password
  REDIS_URL: redis://:your-redis-password@devbox-review-redis:6379
  DEVBOX_KUBECONFIG: |
    apiVersion: v1
    clusters:
      - cluster:
          certificate-authority-data: LS0t...
          server: https://cluster.example.com:6443
        name: sealos
    contexts:
      - context:
          cluster: sealos
          namespace: your-sealos-namespace
          user: admin
        name: admin@sealos
    current-context: admin@sealos
    kind: Config
    preferences: {}
    users:
      - name: admin
        user:
          token: your-kubeconfig-bearer-token
  GITHUB_APP_ID: "123456"
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    your-private-key
    -----END PRIVATE KEY-----
  GITHUB_APP_WEBHOOK_SECRET: your-webhook-secret
