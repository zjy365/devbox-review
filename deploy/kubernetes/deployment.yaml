apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox-review-web
  namespace: devbox-review
  labels:
    app.kubernetes.io/name: devbox-review
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devbox-review
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devbox-review
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: zhujingyang/devbox-review-web:latest
          imagePullPolicy: Always
          args:
            - web
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: devbox-review-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: REDIS_URL
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_APP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: GITHUB_APP_WEBHOOK_SECRET
          volumeMounts:
            - name: devbox-kubeconfig
              mountPath: /var/run/secrets/devbox
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: devbox-kubeconfig
          secret:
            secretName: devbox-review-secret
            items:
              - key: DEVBOX_KUBECONFIG
                path: kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: devbox-review-web
  namespace: devbox-review
  labels:
    app.kubernetes.io/name: devbox-review
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devbox-review
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox-review-worker
  namespace: devbox-review
  labels:
    app.kubernetes.io/name: devbox-review
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devbox-review
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devbox-review
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: zhujingyang/devbox-review-worker:latest
          imagePullPolicy: Always
          args:
            - worker
          envFrom:
            - configMapRef:
                name: devbox-review-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: REDIS_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: OPENAI_API_KEY
            - name: DEVBOX_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: DEVBOX_JWT_SIGNING_KEY
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_APP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: devbox-review-secret
                  key: GITHUB_APP_WEBHOOK_SECRET
          volumeMounts:
            - name: devbox-kubeconfig
              mountPath: /var/run/secrets/devbox
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: devbox-kubeconfig
          secret:
            secretName: devbox-review-secret
            items:
              - key: DEVBOX_KUBECONFIG
                path: kubeconfig
