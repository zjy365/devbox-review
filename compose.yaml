services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    command:
      - web
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      REDIS_URL: redis://redis:6379
      DEVBOX_KUBECONFIG_PATH: /run/secrets/devbox-kubeconfig
    volumes:
      - ${DEVBOX_KUBECONFIG_PATH:?Set DEVBOX_KUBECONFIG_PATH in .env}:/run/secrets/devbox-kubeconfig:ro
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    command:
      - worker
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      REDIS_URL: redis://redis:6379
      DEVBOX_KUBECONFIG_PATH: /run/secrets/devbox-kubeconfig
    volumes:
      - ${DEVBOX_KUBECONFIG_PATH:?Set DEVBOX_KUBECONFIG_PATH in .env}:/run/secrets/devbox-kubeconfig:ro
    depends_on:
      redis:
        condition: service_healthy
